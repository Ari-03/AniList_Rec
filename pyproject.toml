[project]
name = "anilist-rec"
version = "0.1.0"
description = "Offline training + evaluation pipeline for the AniList recommender (SPEC.md)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "implicit>=0.7.2",
    "numpy>=2.0",
    "polars>=1.19",
    "scipy>=1.14",
    "torch>=2.6",
]

[project.scripts]
baseline = "anilist_rec.baseline:main"
demo = "anilist_rec.demo:main"
ease = "anilist_rec.ease:main"
als = "anilist_rec.als:main"
sasrec = "anilist_rec.sasrec:main"

# CPU wheels: the dev boxes have no CUDA and the PyPI linux wheels drag the
# full nvidia stack. A molab (GPU) run swaps this index for the cu-* one.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "kagglehub>=0.3",
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a8",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
